<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ManaShot.io - 3D Multiplayer Magic Arena</title>
    <!-- Modern Cyber-Gothic Font Options -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Screen Damage Vignette Overlay -->
    <div id="damage-vignette"></div>

    <!-- Start Launcher Screen Overlay -->
    <div id="blocker">
        <div id="launcher-card">
            <div id="launcher-header">
                <div id="launcher-title">MANASHOT.IO</div>
                <div id="launcher-subtitle">EXTREME MULTIPLAYER MAGIC ARENA</div>
            </div>

            <button id="play-btn">ENTER ARENA</button>

            <div class="controls-grid">
                <div class="control-item"><span>WASD</span><span class="key-badge">Movement</span></div>
                <div class="control-item"><span>SPACE</span><span class="key-badge">BHop / Jump</span></div>
                <div class="control-item"><span>L-SHIFT</span><span class="key-badge">Slide / Crouch</span></div>
                <div class="control-item"><span>LEFT CLICK</span><span class="key-badge">Lightning Spear</span></div>
            </div>

            <div id="connection-status">
                <span class="status-dot"></span>
                <span id="status-text">CONNECTING TO NETWORK...</span>
            </div>
        </div>
    </div>

    <!-- Crosshair & Hitmarker -->
    <div id="crosshair">
        <div class="crosshair-center"></div>
        <div class="crosshair-line top"></div>
        <div class="crosshair-line bottom"></div>
        <div class="crosshair-line left"></div>
        <div class="crosshair-line right"></div>
    </div>
    <div id="hitmarker"></div>

    <!-- Reload Meter -->
    <div id="reload-bar-container">
        <div id="reload-bar-fill"></div>
    </div>

    <!-- Kill Feed -->
    <div id="kill-feed"></div>

    <!-- Main HUD Overlay -->
    <div id="hud-container">
        <!-- Stats Panel Top-Left -->
        <div class="stats-panel glass-panel">
            <div class="stats-line">
                FPS: <span id="fps-val" class="val-highlight">60</span> |
                PING: <span id="ping-val" class="val-highlight">0 ms</span> |
                SPEED: <span id="speed-val" class="val-highlight">0.0 m/s</span>
            </div>
            <div class="stats-line">
                SLAYS: <span id="slays-val" class="val-gold">0</span> |
                RELOAD BUFF: <span id="reload-buff-val" class="val-gold">0%</span> |
                SPEED BUFF: <span id="speed-buff-val" class="val-gold">0%</span>
            </div>
        </div>

        <!-- Bottom Health Section -->
        <div id="health-section">
            <div class="hud-label">VITALITY STATUS</div>
            <div id="health-bar-container">
                <div id="health-bar-fill"></div>
                <div id="health-text">HP: 100 / 100</div>
            </div>
        </div>
    </div>

    <!-- Core Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>

    <!-- Modular Game Architecture -->
    <script src="js/audio.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/environment.js"></script>
    <script src="js/weapon.js"></script>
    <script src="js/demons.js"></script>
    <script src="js/hud.js"></script>
    <script src="js/network.js"></script>
    <script src="client.js"></script>
</body>
</html>
