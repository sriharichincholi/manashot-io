<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ManaShot.io</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #05040a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    #game-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Top Left Performance & Stats Overlay */
    #perf-overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      font-family: monospace;
      color: #00ffcc;
      font-size: 13px;
      font-weight: bold;
      background: rgba(10, 8, 20, 0.85);
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid rgba(0, 255, 204, 0.4);
      pointer-events: none;
      text-shadow: 0 0 5px rgba(0, 255, 204, 0.5);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* Player Health Bar Container */
    #hp-container {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 240px;
      background: rgba(10, 8, 20, 0.85);
      border: 1px solid rgba(255, 0, 85, 0.5);
      padding: 6px;
      border-radius: 6px;
      pointer-events: none;
    }

    #hp-bar {
      height: 16px;
      width: 100%;
      background: #ff0055;
      border-radius: 3px;
      transition: width 0.1s linear;
      box-shadow: 0 0 10px #ff0055;
    }

    #hp-text {
      color: #fff;
      font-family: monospace;
      font-size: 12px;
      font-weight: bold;
      text-align: center;
      margin-top: 4px;
    }

    /* Crosshair & Reload UI */
    #crosshair-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #crosshair {
      width: 6px;
      height: 6px;
      background: #ffea00;
      border-radius: 50%;
      box-shadow: 0 0 8px #ffea00;
    }

    #reload-bar-container {
      width: 40px;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      margin-top: 10px;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.2s;
    }

    #reload-bar-fill {
      height: 100%;
      width: 0%;
      background: #ffea00;
      box-shadow: 0 0 6px #ffea00;
    }

    /* Invincibility Shield Flash Overlay */
    #shield-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 6px solid #ffea00;
      box-sizing: border-box;
      pointer-events: none;
      opacity: 0;
      box-shadow: inset 0 0 30px rgba(255, 234, 0, 0.4);
      transition: opacity 0.2s;
    }

    /* Killstreak Banner Announcement */
    #banner-announcement {
      position: absolute;
      top: 25%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Impact', sans-serif;
      font-size: 32px;
      letter-spacing: 2px;
      color: #ffea00;
      text-shadow: 0 0 15px #ffea00, 0 0 30px #ff0055;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
    }

    /* Start Screen */
    #blocker {
      position: absolute;
      width: 100%;
      height: 100%;
      background: rgba(5, 4, 10, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      cursor: pointer;
    }

    #blocker h1 {
      font-size: 54px;
      margin: 0 0 10px 0;
      letter-spacing: 6px;
      color: #ffea00;
      text-shadow: 0 0 20px rgba(255, 234, 0, 0.6);
    }

    #blocker p {
      font-size: 16px;
      color: #cccccc;
      margin: 5px 0;
    }

    .controls-hint {
      font-size: 13px;
      color: #888;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div id="perf-overlay">
    <div>FPS: <span id="fps-val">60</span> | PING: <span id="ping-val">0</span> ms | SPEED: <span id="speed-val">0</span> m/s</div>
    <div style="color: #ffea00;">SLAYS: <span id="kills-val">0</span> | RELOAD BUFF: <span id="reload-buff-val">0</span>% | SPEED BUFF: <span id="speed-buff-val">0</span>%</div>
  </div>

  <div id="hp-container">
    <div id="hp-bar"></div>
    <div id="hp-text">HP: 100 / 100</div>
  </div>

  <div id="crosshair-container">
    <div id="crosshair"></div>
    <div id="reload-bar-container">
      <div id="reload-bar-fill"></div>
    </div>
  </div>

  <div id="shield-overlay"></div>
  <div id="banner-announcement">10 DEMONS SLAYED! +2.5% MOVEMENT SPEED</div>

  <div id="blocker">
    <h1>MANASHOT.IO</h1>
    <p>Click anywhere to enter</p>
    <div class="controls-hint">WASD = Move | SPACE = Jump / Bhop | L-SHIFT = Crouch Slide | LEFT CLICK = Fire Lightning Spear</div>
  </div>

  <canvas id="game-canvas"></canvas>

  <script src="/socket.io/socket.io.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
  <script type="module" src="client.js"></script>
</body>
</html>
